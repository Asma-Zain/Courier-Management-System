<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Track · Parcelly</title>
  <link rel="icon" href="/img/logo.svg" type="image/svg+xml">
  <link rel="stylesheet" href="/css/theme.css">
</head>
<body>
<main>
  <div id="msg" hidden></div>
  <div id="search-slot" class="card"></div>
  <section id="result" hidden>
    <div class="card summary">
      <img src="/img/box.svg" alt="">
      <div class="info">
        <div class="id-line"><span id="d-id"></span><button class="icon copy-btn" id="copy-id" type="button" aria-label="Copy shipment ID"></button></div>
        <div class="route-line" id="d-route"></div>
        <div class="sub" id="d-sub"></div>
      </div>
      <div class="tools"><span id="d-status"></span><button class="icon" id="share" type="button" aria-label="Copy link to this shipment"></button></div>
    </div>
    <div class="split">
      <div class="card"><h2>Journey</h2><ol class="timeline" id="timeline"></ol></div>
      <div class="card map-card">
        <div class="map-stage">
          <div class="route-map" id="map"></div>
          <div class="map-eta" id="eta"></div>
          <a class="button map-btn" id="map-link" href="#">View on map</a>
        </div>
        <div class="map-note">Route drawn from this shipment's scan locations. Not live GPS.</div>
      </div>
    </div>
    <div class="grid">
      <div class="card"><h2>Details</h2><dl class="facts" id="details"></dl></div>
      <div class="card"><h2>Packages</h2><div id="packages"></div></div>
    </div>
    <div class="card" id="delivered-link" hidden><div class="row between"><span>This parcel has been delivered.</span><a class="button" id="delivered-a" href="#">See confirmation</a></div></div>
    <div class="card"><h2>Graph view</h2><div id="graph" class="graph"></div></div>
    <div class="grid" id="staff-forms" hidden>
      <form class="card" id="event-form">
        <h2>Add tracking event</h2>
        <div class="form-grid">
          <label>Status <select id="ev-status" required></select></label>
          <label>Branch / hub <select id="ev-branch" required></select></label>
        </div>
        <button type="submit">Add event</button>
      </form>
      <form class="card" id="pay-form">
        <h2>Record payment</h2>
        <div class="form-grid">
          <label>Amount <input id="pay-amount" type="number" step="0.01" min="0.01" required></label>
          <label>Mode <select id="pay-mode"></select></label>
          <label>Status <select id="pay-status"></select></label>
        </div>
        <button type="submit">Record payment</button>
      </form>
    </div>
  </section>
</main>
<script src="/js/api.js"></script>
<script src="/js/ui.js"></script>
<script src="https://unpkg.com/vis-network@9.1.9/standalone/umd/vis-network.min.js"></script>
<script src="/js/pages/track.js"></script>
</body>
</html>
