<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Reports · Parcelly</title>
  <meta name="description" content="Operational, people, money and shipment reports.">
  <link rel="icon" href="/img/logo.svg" type="image/svg+xml">
  <link rel="stylesheet" href="/css/theme.css">
</head>
<body>
<main id="main">
  <div class="page-head no-print"><h1>Reports</h1></div>
  <div class="layout-side">
    <nav class="card no-print" aria-label="Reports"><ul class="report-list" id="report-list"></ul></nav>
    <section class="card" id="report" aria-live="polite">
      <div id="msg" hidden></div>
      <div class="card-head"><div><h2 id="r-title"></h2><p class="muted small" id="r-desc"></p></div>
        <div class="row no-print"><button type="button" class="secondary" id="csv"></button><button type="button" class="secondary" id="print"></button></div></div>
      <div class="row no-print" id="r-param" hidden><label>Customer to analyse <select id="r-customer"></select></label></div>
      <div id="r-chart"></div>
      <div id="r-table"></div>
      <details class="query no-print"><summary>Show query</summary><p class="small muted" id="r-qid"></p><pre><code id="r-cypher"></code></pre></details>
    </section>
  </div>
</main>
<script src="/js/api.js"></script>
<script src="/js/ui.js"></script>
<script src="/js/layout.js"></script>
<script src="/js/pages/reports.js"></script>
</body>
</html>
