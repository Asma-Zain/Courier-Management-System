<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Reports · Courier Tracking</title>
  <link rel="stylesheet" href="/css/theme.css">
</head>
<body>
<main>
  <h1>Reports</h1>
  <div id="msg" hidden></div>
  <form id="report-form" class="card row">
    <label>Report <select id="report"></select></label>
    <label id="cust-wrap" hidden>Customer id <input id="cust" type="number" min="1" value="1"></label>
    <button type="submit">Run</button>
  </form>
  <div class="card"><h2 id="report-title"></h2><p class="muted small" id="report-desc"></p><div id="result"></div></div>
</main>
<script src="/js/api.js"></script>
<script src="/js/ui.js"></script>
<script src="/js/pages/reports.js"></script>
</body>
</html>
