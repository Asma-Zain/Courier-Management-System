<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Home · Parcelly</title>
  <link rel="icon" href="/img/logo.svg" type="image/svg+xml">
  <link rel="stylesheet" href="/css/theme.css">
</head>
<body>
<main>
  <div id="msg" hidden></div>
  <section class="hero">
    <div>
      <h1>Your parcels, <span class="accent">on their way</span></h1>
      <p class="lead">Track your parcels and see every scan, from booking to delivery.</p>
      <div id="search-slot"></div>
      <p class="try-line" id="try"></p>
    </div>
    <div class="hero-art">
      <span class="hero-note" aria-hidden="true">On my way!</span>
      <img class="mascot-bob" src="/img/mascot.svg" alt="">
    </div>
  </section>
  <section class="actions" aria-label="Quick actions">
    <a class="action-card" href="/track.html"><span class="tile coral" id="i-track"></span><span><strong>Track a Parcel</strong><span class="sub">Enter a shipment ID</span></span></a>
    <a class="action-card" href="/book.html"><span class="tile butter" id="i-send"></span><span><strong>Send a Parcel</strong><span class="sub">Book with one or more packages</span></span></a>
    <a class="action-card" href="/route.html"><span class="tile mint" id="i-route"></span><span><strong>Plan a Route</strong><span class="sub">Fewest hops or kilometres</span></span></a>
    <a class="action-card" href="/parcels.html"><span class="tile peach" id="i-list"></span><span><strong id="parcels-title">My Parcels</strong><span class="sub">Everything in one place</span></span></a>
  </section>
</main>
<script src="/js/api.js"></script>
<script src="/js/ui.js"></script>
<script src="/js/pages/home.js"></script>
</body>
</html>
