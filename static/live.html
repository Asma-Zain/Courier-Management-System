<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Live tracking · Parcelly</title>
  <link rel="icon" href="/img/logo.svg" type="image/svg+xml">
  <link rel="stylesheet" href="/css/theme.css">
</head>
<body>
<main>
  <div class="live-head">
    <a class="icon-btn button icon" id="back" href="/track.html" aria-label="Back to shipment"></a>
    <h1>Live Tracking</h1>
  </div>
  <div id="msg" hidden></div>
  <section id="result" hidden>
    <div class="card map-card live-map">
      <div class="map-stage">
        <div class="route-map" id="map"></div>
        <div class="map-eta" id="eta"></div>
      </div>
      <div class="map-note">Route drawn from scan locations. The system records scans, not live GPS.</div>
    </div>
    <div class="card">
      <div class="row between"><h2>Shipment details</h2><a id="view-all" href="#">View all</a></div>
      <div class="row between"><span class="id-line mono" id="d-id"></span><span id="d-status"></span></div>
      <div class="ship-bar">
        <div><span class="lbl">From</span><strong id="d-from"></strong></div>
        <div><span class="lbl">To</span><strong id="d-to"></strong></div>
        <div><span class="lbl">Last scan</span><strong id="d-scan"></strong></div>
        <div><span class="lbl">Scanned</span><strong id="d-when"></strong></div>
      </div>
    </div>
  </section>
</main>
<script src="/js/api.js"></script>
<script src="/js/ui.js"></script>
<script src="/js/pages/live.js"></script>
</body>
</html>
