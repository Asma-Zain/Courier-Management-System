<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Customers · Courier Tracking</title>
  <link rel="stylesheet" href="/css/theme.css">
</head>
<body>
<main>
  <h1>Customers</h1>
  <div id="msg" hidden></div>
  <form class="card" id="cust-form">
    <h2 id="form-title">Add customer</h2>
    <div class="form-grid">
      <label>First name <input id="firstName" required maxlength="60"></label>
      <label>Last name <input id="lastName" required maxlength="60"></label>
      <label>Email <input id="email" type="email" required></label>
      <label>Phone (10 digits) <input id="phone" required pattern="[0-9]{10}"></label>
      <label>Street <input id="street" required></label>
      <label>City <input id="city" required></label>
      <label>State <input id="state" required></label>
      <label>Pincode (6 digits) <input id="pincode" required pattern="[0-9]{6}"></label>
    </div>
    <p class="small muted" id="edit-hint" hidden>When editing, only phone and address can change.</p>
    <div class="row">
      <button type="submit" id="save">Create customer</button>
      <button type="button" class="secondary" id="cancel" hidden>Cancel edit</button>
    </div>
  </form>
  <div class="card"><div id="list"></div></div>
</main>
<script src="/js/api.js"></script>
<script src="/js/ui.js"></script>
<script src="/js/pages/customers.js"></script>
</body>
</html>
