<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Delivered · Parcelly</title>
  <link rel="icon" href="/img/logo.svg" type="image/svg+xml">
  <link rel="stylesheet" href="/css/theme.css">
</head>
<body>
<main>
  <div id="msg" hidden></div>
  <section class="delivered" id="result" hidden>
    <img class="mascot mascot-bob" src="/img/mascot-happy.svg" alt="">
    <h1>Delivered!</h1>
    <p class="lead">Your parcel has been successfully delivered.</p>
    <div class="card">
      <img src="/img/box.svg" alt="">
      <div>
        <strong class="mono" id="d-id"></strong>
        <div class="muted small">Delivered on</div><div id="d-when"></div>
        <div class="muted small">Recipient</div><div id="d-who"></div>
      </div>
    </div>
    <div class="btns">
      <a class="button secondary" href="/track.html">Track Another Parcel</a>
      <a class="button" id="details" href="#">View Details</a>
    </div>
  </section>
</main>
<script src="/js/api.js"></script>
<script src="/js/ui.js"></script>
<script src="/js/pages/delivered.js"></script>
</body>
</html>
